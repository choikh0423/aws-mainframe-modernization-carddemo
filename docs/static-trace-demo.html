<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devin Static Trace: Dynamic Call Resolution</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    overflow: hidden;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(90deg, #0d1b2a 0%, #1b2838 100%);
    border-bottom: 1px solid #1e3a5f;
    height: 56px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #4da6ff;
    letter-spacing: 0.5px;
  }
  header h1 span { color: #00ff88; }
  .mode-badge {
    background: #1a1a2e;
    border: 1px solid #ffa94d;
    color: #ffa94d;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  button {
    padding: 6px 16px;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #play-btn {
    background: #00ff88;
    color: #0a0a1a;
  }
  #play-btn:hover { background: #00cc6a; }
  #play-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  #reset-btn {
    background: transparent;
    border: 1px solid #555;
    color: #888;
  }
  #reset-btn:hover { background: rgba(255,255,255,0.05); }
  .nav-link {
    color: #4da6ff;
    text-decoration: none;
    font-size: 11px;
    border: 1px solid #4da6ff;
    padding: 4px 12px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .nav-link:hover { background: rgba(77,166,255,0.1); }

  main {
    display: flex;
    height: calc(100vh - 56px);
  }

  #diagram-panel {
    flex: 1;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #call-tree {
    width: 100%;
    height: 100%;
    max-width: 900px;
    max-height: 800px;
  }

  #step-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 1px solid #4da6ff;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    color: #4da6ff;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 10;
    pointer-events: none;
  }
  #step-indicator.visible { opacity: 1; }
  #step-indicator .step-num { color: #00ff88; font-weight: 700; }

  #event-panel {
    width: 440px;
    background: #0d1117;
    border-left: 1px solid #1e3a5f;
    display: flex;
    flex-direction: column;
  }
  #event-panel h3 {
    padding: 12px 16px;
    font-size: 13px;
    color: #4da6ff;
    border-bottom: 1px solid #1e3a5f;
    font-weight: 600;
  }
  #event-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .log-entry {
    padding: 10px 16px;
    border-bottom: 1px solid #111;
    font-size: 11px;
    line-height: 1.5;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .log-entry .log-step {
    color: #00ff88;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .log-entry .log-file {
    color: #ffa94d;
    font-size: 10px;
  }
  .log-entry .log-msg {
    color: #c9d1d9;
    margin-top: 2px;
  }
  .log-entry .devin-response {
    background: #161b22;
    border: 1px solid #1e3a5f;
    border-left: 3px solid #4da6ff;
    border-radius: 4px;
    padding: 8px 10px;
    margin-top: 6px;
    font-size: 10px;
    color: #8b949e;
    line-height: 1.6;
  }
  .log-entry .devin-response .devin-label {
    color: #4da6ff;
    font-weight: 700;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .log-entry .devin-response code {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 3px;
    padding: 2px 4px;
    font-size: 10px;
    color: #e0e0e0;
  }
  .log-entry .devin-response .cobol-block {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 4px;
    padding: 6px 8px;
    margin: 6px 0;
    font-size: 10px;
    white-space: pre;
    overflow-x: auto;
    color: #8b949e;
  }
  .log-entry .devin-response .cobol-block .kw { color: #ff7b72; }
  .log-entry .devin-response .cobol-block .str { color: #a5d6ff; }
  .log-entry .devin-response .cobol-block .resolved { color: #00ff88; font-weight: 700; }
  .log-entry .devin-response .cobol-block .cmt { color: #555; font-style: italic; }

  .node-rect {
    fill: #1a1a2e;
    stroke: #333;
    stroke-width: 2;
    rx: 8;
    transition: all 0.8s ease;
  }
  .node-rect.active {
    fill: #0a2e1a;
    stroke: #00ff88;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 8px rgba(0,255,136,0.4));
  }
  .node-rect.mutation {
    fill: #2e1a0a;
    stroke: #ff6b6b;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 8px rgba(255,107,107,0.4));
  }
  .node-rect.batch {
    fill: #1a1a2e;
    stroke: #ffa94d;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 8px rgba(255,169,77,0.3));
  }
  .node-label {
    fill: #555;
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    text-anchor: middle;
    transition: fill 0.8s ease;
    pointer-events: none;
  }
  .node-label.active { fill: #00ff88; }
  .node-label.mutation { fill: #ff6b6b; }
  .node-label.batch { fill: #ffa94d; }
  .node-sublabel {
    fill: #444;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    text-anchor: middle;
    transition: fill 0.8s ease;
    pointer-events: none;
  }
  .node-sublabel.active { fill: #88ffbb; }
  .node-sublabel.mutation { fill: #ffaaaa; }
  .node-sublabel.batch { fill: #ffcc88; }
  .edge-line {
    stroke: #2a2a3e;
    stroke-width: 2;
    fill: none;
    transition: all 0.8s ease;
    marker-end: url(#arrow-gray);
  }
  .edge-line.active {
    stroke: #00ff88;
    stroke-width: 2.5;
    marker-end: url(#arrow-green);
    filter: drop-shadow(0 0 4px rgba(0,255,136,0.3));
  }
  .edge-line.mutation {
    stroke: #ff6b6b;
    stroke-width: 2.5;
    marker-end: url(#arrow-red);
    filter: drop-shadow(0 0 4px rgba(255,107,107,0.3));
  }
  .edge-line.batch {
    stroke: #ffa94d;
    stroke-width: 2.5;
    marker-end: url(#arrow-orange);
  }
  .edge-label {
    fill: #333;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    text-anchor: middle;
    transition: fill 0.8s ease;
    pointer-events: none;
  }
  .edge-label.active { fill: #00ff88; }
  .edge-label.mutation { fill: #ff6b6b; }
  .edge-label.batch { fill: #ffa94d; }
  .batch-line {
    stroke: #ffa94d;
    stroke-width: 1;
    stroke-dasharray: 8 4;
    opacity: 0.4;
  }
  .batch-label {
    fill: #ffa94d;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    text-anchor: middle;
    opacity: 0.4;
  }
  .data-badge {
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .data-badge.visible { opacity: 1; }
  .data-badge rect {
    fill: #ff6b6b;
    rx: 4;
  }
  .data-badge text {
    fill: #fff;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    text-anchor: middle;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(0,255,136,0.4)); }
    50% { filter: drop-shadow(0 0 16px rgba(0,255,136,0.7)); }
  }
  .node-rect.active-pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Typing cursor animation */
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .typing-cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: #4da6ff;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
</style>
</head>

<script>
// ============================================================
//  PRE-RECORDED DEVIN RESPONSES
//  These are actual Devin analysis outputs from tracing through
//  the CardDemo COBOL source code.
// ============================================================
const STATIC_TRACE = [
  {
    title: 'Step 1: Menu Dispatch',
    subtitle: 'Resolving dynamic XCTL from COMEN02Y data table',
    nodes: ['node-terminal', 'node-comen01c', 'node-comen02y'],
    edges: ['edge-terminal-comen01c', 'edge-comen01c-comen02y'],
    edgeLabels: ['elabel-terminal-comen01c', 'elabel-comen01c-comen02y'],
    nodeClass: 'active',
    edgeClass: 'active',
    file: 'app/cpy/COMEN02Y.cpy (line 69-71)',
    badge: null,
    devinResponse: `<div class="devin-label">Devin reading COMEN02Y.cpy</div>
I found the menu data table at <code>app/cpy/COMEN02Y.cpy</code>. The structure uses a <code>REDEFINES</code> overlay to map option numbers to program names. Each menu entry is a group of three FILLER fields: a 2-digit option number, a 35-char description, and an 8-char program name.

For option 8 (Add Transaction):
<div class="cobol-block"><span class="cmt">* COMEN02Y.cpy lines 69-71:</span>
10 FILLER  PIC 9(02) VALUE <span class="resolved">8</span>.
10 FILLER  PIC X(35) VALUE
    <span class="str">'Transaction Add'</span>.
10 FILLER  PIC X(08) VALUE <span class="resolved">'COTRN02C'</span>.</div>
The menu dispatch program <code>COMEN01C</code> reads the user's selection, indexes into this table via the <code>REDEFINES</code> overlay <code>CDEMO-MENU-OPT-PGMNAME(WS-OPTION)</code>, and uses CICS XCTL to transfer control to the resolved program name &mdash; in this case <code>COTRN02C</code>. This is a <b>runtime resolution</b>: the target program name is not hardcoded in the XCTL statement.`,
    delay: 4000
  },
  {
    title: 'Step 2: XCTL Transfer',
    subtitle: 'Control transfers to COTRN02C via CICS XCTL + COMMAREA',
    nodes: ['node-cotrn02c'],
    edges: ['edge-comen01c-cotrn02c'],
    edgeLabels: ['elabel-comen01c-cotrn02c'],
    nodeClass: 'active',
    edgeClass: 'active',
    file: 'app/cbl/COMEN01C.cbl (lines 184-187)',
    badge: null,
    devinResponse: `<div class="devin-label">Devin reading COMEN01C.cbl</div>
The XCTL statement in COMEN01C passes the full <code>CARDDEMO-COMMAREA</code> (defined in copybook <code>COCOM01Y.cpy</code>) to the target program:
<div class="cobol-block"><span class="kw">EXEC CICS</span>
    <span class="kw">XCTL PROGRAM</span>(CDEMO-MENU-OPT-PGMNAME(WS-OPTION))
    <span class="kw">COMMAREA</span>(CARDDEMO-COMMAREA)
<span class="kw">END-EXEC</span></div>
The COMMAREA carries session state across the XCTL boundary: the signed-on user ID, security flags, current program name, and previous program name. <code>COTRN02C</code> receives this via its own <code>DFHCOMMAREA</code> and copies it into its working storage copy of <code>CARDDEMO-COMMAREA</code>.

This is key: <b>grep cannot find this call</b> because the program name is a variable (<code>CDEMO-MENU-OPT-PGMNAME(WS-OPTION)</code>), not a literal. You must read the COMEN02Y data table to resolve it.`,
    delay: 3500
  },
  {
    title: 'Step 3: Cross-Reference Lookup',
    subtitle: 'Variable dataset names resolved by CICS File Control Table',
    nodes: ['node-ccxref', 'node-cxacaix'],
    edges: ['edge-cotrn02c-ccxref', 'edge-cotrn02c-cxacaix'],
    edgeLabels: ['elabel-cotrn02c-ccxref', 'elabel-cotrn02c-cxacaix'],
    nodeClass: 'active',
    edgeClass: 'active',
    file: 'app/cbl/COTRN02C.cbl (lines 39-42, 579, 612)',
    badge: null,
    devinResponse: `<div class="devin-label">Devin reading COTRN02C.cbl</div>
COTRN02C defines its VSAM dataset names as working storage variables, not literals:
<div class="cobol-block"><span class="cmt">* COTRN02C.cbl lines 39-42:</span>
05 WS-TRANSACT-FILE  PIC X(08) VALUE <span class="str">'TRANSACT'</span>.
05 WS-CCXREF-FILE    PIC X(08) VALUE <span class="str">'CCXREF  '</span>.
05 WS-CXACAIX-FILE   PIC X(08) VALUE <span class="str">'CXACAIX '</span>.</div>
When the user enters a card number, COTRN02C first looks up the card-to-account mapping using CICS READ with these variable dataset names:
<div class="cobol-block"><span class="kw">EXEC CICS READ</span>
    DATASET(<span class="resolved">WS-CXACAIX-FILE</span>)  <span class="cmt">&larr; 'CXACAIX' resolved by FCT</span>
    INTO(ACCT-XREF-RECORD)

// ============================================================
//  STATE
// ============================================================
let isRunning = false;

// ============================================================
//  REPLAY
// ============================================================
async function startReplay() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('play-btn').disabled = true;
  document.getElementById('event-log').innerHTML = '';

  // Initial "session" log entry
  addLogEntry({
    title: 'Trace Session',
    file: '',
    devinResponse: '<div class="devin-label">Pre-recorded Devin Session</div>This is a replay of Devin\'s dynamic call resolution trace through the CardDemo "Add Transaction" flow. Each step shows the actual files Devin read and the analysis it produced.'
  });

  await sleep(1500);

  for (let i = 0; i < STATIC_TRACE.length; i++) {
    if (!isRunning) break;
    const step = STATIC_TRACE[i];
    highlightStep(step);
    addLogEntry(step);
    await sleep(step.delay);
  }

  if (isRunning) {
    showStepIndicator('Trace Complete', 'All dynamic calls resolved');
    addCompletionEntry();
  }
  isRunning = false;
  document.getElementById('play-btn').disabled = false;
}

// ============================================================
//  DIAGRAM MANIPULATION
// ============================================================
function highlightStep(step) {
  showStepIndicator(step.title, step.subtitle);

  (step.nodes || []).forEach(nodeId => {
    const g = document.getElementById(nodeId);
    if (!g) return;
    const rect = g.querySelector('.node-rect');
    const label = g.querySelector('.node-label');
    const sublabel = g.querySelector('.node-sublabel');
    if (rect) { rect.classList.add(step.nodeClass); rect.classList.add('active-pulse'); }
    if (label) label.classList.add(step.nodeClass);
    if (sublabel) sublabel.classList.add(step.nodeClass);
    setTimeout(() => { if (rect) rect.classList.remove('active-pulse'); }, 2000);
  });

  (step.edges || []).forEach(edgeId => {
    const el = document.getElementById(edgeId);
    if (el) el.classList.add(step.edgeClass);
  });

  (step.edgeLabels || []).forEach(labelId => {
    const el = document.getElementById(labelId);
    if (el) el.classList.add(step.edgeClass);
  });

  if (step.badge) {
    const badge = document.getElementById(step.badge);
    if (badge) badge.classList.add('visible');
  }
}

function showStepIndicator(title, subtitle) {
  const indicator = document.getElementById('step-indicator');
  indicator.querySelector('.step-num').textContent = title;
  indicator.querySelector('.step-text').textContent = subtitle ? '\u2014 ' + subtitle : '';
  indicator.classList.add('visible');
}

function addLogEntry(step) {
  const log = document.getElementById('event-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <div class="log-step">${step.title}</div>
    ${step.file ? `<div class="log-file">${step.file}</div>` : ''}
    ${step.devinResponse ? `<div class="devin-response">${step.devinResponse}</div>` : ''}
  `;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function addCompletionEntry() {
  const log = document.getElementById('event-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <div class="log-step" style="color:#4da6ff;">TRACE COMPLETE</div>
    <div class="devin-response">
      <div class="devin-label">Devin Summary</div>
      All 7 dynamic call resolution steps traced successfully from actual COBOL source.<br><br>
      <b style="color:#00ff88;">Programs resolved:</b> COMEN01C &rarr; COTRN02C &rarr; CSUTLDTC &rarr; CEEDAYS &rarr; CBTRN02C<br>
      <b style="color:#ff6b6b;">Data mutations:</b> TRANSACT (online write) &rarr; ACCOUNT + TCATBAL (batch update)<br>
      <b style="color:#ffa94d;">Resolution mechanisms:</b> XCTL data table, CALL positional params, CICS FCT, OS loader<br><br>
      <b>Key insight:</b> None of these program-to-program links are discoverable via grep or static text search. Each required semantic understanding of COBOL data structures, CICS runtime behavior, and positional parameter mapping across LINKAGE SECTION boundaries.
    </div>
  `;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

// ============================================================
//  RESET
// ============================================================
function resetAll() {
  isRunning = false;
  document.getElementById('play-btn').disabled = false;

  document.querySelectorAll('.node-rect').forEach(el => { el.className = 'node-rect'; });
  document.querySelectorAll('.node-label').forEach(el => { el.className = 'node-label'; });
  document.querySelectorAll('.node-sublabel').forEach(el => { el.className = 'node-sublabel'; });
  document.querySelectorAll('.edge-line').forEach(el => { el.className = 'edge-line'; });
  document.querySelectorAll('.edge-label').forEach(el => { el.className = 'edge-label'; });
  document.querySelectorAll('.data-badge').forEach(el => { el.classList.remove('visible'); });
  document.getElementById('step-indicator').classList.remove('visible');
  document.getElementById('event-log').innerHTML = `
    <div style="padding: 16px; color: #555; font-size: 11px; text-align: center;">
      Click <b>Play Trace</b> to replay Devin's pre-recorded dynamic call resolution
    </div>
  `;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
